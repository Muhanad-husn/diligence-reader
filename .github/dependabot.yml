# Weekly grouped updates. The exact pins in pyproject.toml stay; a Dependabot pull request is
# merged by the founder like any other. No npm entry: web/ has no package.json.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Raise a pinned range to the new release instead of widening it.
    versioning-strategy: increase
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: helm
    directory: /deploy/helm/diligence-reader
    schedule:
      interval: weekly
    groups:
      chart:
        patterns: ["*"]
