apiVersion: v1
kind: Service
metadata:
  name: {{ include "diligence-reader.fullname" . }}
  labels:
    {{- include "diligence-reader.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "diligence-reader.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
