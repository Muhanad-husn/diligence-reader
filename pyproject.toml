[project]
name = "diligence-reader"
version = "0.8.0"
description = "Reads an acquisition data room and writes a cited, verified findings report; a fixed rebuild of a recursive language model run"
requires-python = "==3.13.*"
dependencies = [
    "pdftext==0.7.1",
    "pypdf==6.19.0",
    "pdfplumber==0.11.10",
    "openpyxl==3.1.5",
    "httpx>=0.28.1,<0.29",
    "pyyaml>=6.0.3,<7",
    "html2text==2025.4.15",
    "pypandoc-binary==1.17",
    "typst==0.15.0",
    "fastapi>=0.142.2,<0.143",
    "uvicorn>=0.54,<0.55",
    "ag-ui-protocol==1.0.0",
    "python-multipart>=0.0.32,<0.1",
]

license = "Apache-2.0"
readme = "README.md"

[project.scripts]
diligence-reader = "rlm.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "python-docx", "pytest-playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
