[project]
name = "diligence-reader"
version = "0.0.0"
description = "Reads an acquisition data room and writes a cited, verified findings report; a fixed rebuild of a recursive language model run"
requires-python = "==3.13.*"
dependencies = [
    "pdftext==0.7.1",
    "pypdf==6.16.2",
    "pdfplumber==0.11.10",
    "openpyxl==3.1.5",
    "httpx>=0.28,<0.29",
    "pyyaml>=6,<7",
    "html2text==2025.4.15",
]

license = "Apache-2.0"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
